<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Greek meander tile -->
    <pattern id="meander" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <!-- Key/meander shape -->
      <polyline points="0,15 5,15 5,5 15,5 15,15 10,15 10,10 0,10" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"/>
    </pattern>

    <!-- Circular clip for the meander border ring -->
    <clipPath id="outerRing">
      <path d="
        M 200,200
        m -185,0
        a 185,185 0 1,1 370,0
        a 185,185 0 1,1 -370,0
        M 200,200
        m -160,0
        a 160,160 0 1,0 320,0
        a 160,160 0 1,0 -320,0
        Z
      " fill-rule="evenodd"/>
    </clipPath>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&amp;display=swap');
    </style>
  </defs>

  <!-- Black background circle -->
  <circle cx="200" cy="200" r="198" fill="#000000"/>

  <!-- Outer white ring border -->
  <circle cx="200" cy="200" r="192" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="200" cy="200" r="178" fill="none" stroke="white" stroke-width="2"/>

  <!-- Meander pattern ring (between r=178 and r=192) -->
  <rect x="0" y="0" width="400" height="400" fill="url(#meander)" clip-path="url(#outerRing)"/>

  <!-- Inner separator ring -->
  <circle cx="200" cy="200" r="164" fill="none" stroke="white" stroke-width="1.5"/>

  <!-- GREEK text -->
  <text
    x="200" y="178"
    font-family="Cinzel, 'Trajan Pro', 'Times New Roman', Georgia, serif"
    font-size="58"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    letter-spacing="8"
  >GREEK</text>

  <!-- ON THE text -->
  <text
    x="200" y="212"
    font-family="Cinzel, 'Trajan Pro', 'Times New Roman', Georgia, serif"
    font-size="22"
    font-weight="400"
    fill="white"
    text-anchor="middle"
    letter-spacing="6"
  >ON THE</text>

  <!-- STREET text -->
  <text
    x="200" y="262"
    font-family="Cinzel, 'Trajan Pro', 'Times New Roman', Georgia, serif"
    font-size="52"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    letter-spacing="6"
  >STREET</text>
</svg>
