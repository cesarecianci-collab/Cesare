<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="98" fill="#0a0a0a" stroke="white" stroke-width="1.5"/>

  <!-- Outer meander/Greek key border -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="white" stroke-width="1"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="white" stroke-width="1"/>

  <!-- Greek meander pattern (simplified dots between circles) -->
  <g stroke="white" stroke-width="1.5" fill="none">
    <!-- Top meander segments -->
    <path d="M 20,100 a80,80 0 0,1 160,0" stroke-dasharray="4,3" stroke-width="2" opacity="0.6"/>
    <path d="M 20,100 a80,80 0 0,0 160,0" stroke-dasharray="4,3" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Text: GREEK -->
  <text x="100" y="72"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="26"
    font-weight="bold"
    fill="white"
    text-anchor="middle"
    letter-spacing="4">GREEK</text>

  <!-- Text: ON THE -->
  <text x="100" y="95"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="13"
    fill="white"
    text-anchor="middle"
    letter-spacing="2">ON THE</text>

  <!-- Text: STREET -->
  <text x="100" y="122"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="26"
    font-weight="bold"
    fill="white"
    text-anchor="middle"
    letter-spacing="4">STREET</text>

  <!-- Decorative lines -->
  <line x1="42" y1="84" x2="62" y2="84" stroke="white" stroke-width="1"/>
  <line x1="138" y1="84" x2="158" y2="84" stroke="white" stroke-width="1"/>
  <line x1="42" y1="108" x2="62" y2="108" stroke="white" stroke-width="1"/>
  <line x1="138" y1="108" x2="158" y2="108" stroke="white" stroke-width="1"/>

  <!-- Corner meander squares (top left of each quadrant) -->
  <rect x="86" y="128" width="28" height="2" fill="white" opacity="0.5"/>
</svg>
